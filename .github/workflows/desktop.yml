name: Native desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/desktop.yml"
      - "apps/desktop/**"
      - "apps/host/**"
      - "packages/**"
      - "plugins/**"
      - "scripts/desktop/**"
      - "scripts/release/**"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: native-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-2025
            bundles: nsis,msi
          - name: macos-arm64
            runner: macos-15
            bundles: app,dmg
          - name: linux-x64
            runner: ubuntu-22.04
            bundles: deb,appimage

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.10.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-27
        with:
          toolchain: 1.89.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install workspace
        run: corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify dependency supply chain
        run: corepack pnpm audit --audit-level high --registry=https://registry.npmjs.org

      - name: Verify dependency signatures
        run: corepack pnpm audit signatures --registry=https://registry.npmjs.org

      # Each command has its own exit status on PowerShell as well as bash.
      - name: Test packaging retry policy
        run: node --test scripts/desktop/retry-package.node.mjs

      - name: Lint workspace
        run: corepack pnpm lint

      - name: Typecheck workspace
        run: corepack pnpm typecheck

      - name: Unit tests
        # SQLite/file fixtures contend for disk when every suite runs at once.
        run: corepack pnpm test:unit --maxWorkers=1

      - name: Integration tests
        run: corepack pnpm test:integration

      - name: End-to-end tests
        run: corepack pnpm test:e2e

      - name: Verify native desktop
        run: corepack pnpm desktop:check

      - name: Build native package
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: node scripts/desktop/retry-package.mjs --bundles ${{ matrix.bundles }}

      - name: Hash native installers
        run: node scripts/release/hash-artifacts.mjs apps/desktop/src-tauri/target/release/bundle

      - name: Upload native installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentme-${{ matrix.name }}
          path: apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
